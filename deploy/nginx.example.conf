# Example: serve sysdash through nginx at the site root, for VPN peers only.
# Copy this `location` block into a `server { … }` block of your nginx config, change the
# addresses, then `sudo nginx -t && sudo systemctl reload nginx`.
#
# sysdash can stop services and has no login, so allow only networks you trust. Here that
# is a WireGuard subnet (10.10.0.0/24) and this machine; everything else gets 403.

location / {
    allow 10.10.0.0/24;
    allow 127.0.0.1;
    deny all;

    # Where sysdash listens (its BIND setting).
    proxy_pass http://127.0.0.1:8091;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Deleting a large folder can take a while.
    proxy_read_timeout 120s;
}
